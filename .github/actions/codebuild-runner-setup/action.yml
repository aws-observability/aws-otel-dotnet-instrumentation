name: CodeBuild runner setup
description: >
  Gives CodeBuild-hosted runners the tools and settings our workflows expect from GitHub-hosted images.
  Only changes what is missing, so it is a no-op on GitHub-hosted runners.
  Git long paths on Windows must already be enabled for checkout (see the GIT_CONFIG_* env in the
  calling workflow), since this action is only available after checkout.
runs:
  using: composite
  steps:
    # CodeBuild's Windows workspace path is ~140 characters (GitHub's is ~70), which pushes build outputs
    # past the 260-character MAX_PATH limit. GitHub's images enable long paths; CodeBuild's do not.
    - name: Enable Windows long paths
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $key = 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem'
        if ((Get-ItemProperty $key -Name LongPathsEnabled -ErrorAction SilentlyContinue).LongPathsEnabled -ne 1) {
          New-ItemProperty $key -Name LongPathsEnabled -Value 1 -PropertyType DWord -Force | Out-Null
        }

    - name: Put Git Bash on PATH
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if (-not (Get-Command bash -ErrorAction SilentlyContinue)) {
          Add-Content $env:GITHUB_PATH "$env:ProgramFiles\Git\bin"
        }

    - name: Install missing Windows CLIs
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $missing = @('gh', 'jq') | Where-Object { -not (Get-Command $_ -ErrorAction SilentlyContinue) }
        if ($missing) {
          choco install @missing -y --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Chocolatey updates the machine PATH, which this runner process does not reload.
          foreach ($dir in "$env:ProgramFiles\GitHub CLI", "$env:ProgramData\chocolatey\bin") {
            if (Test-Path $dir) { Add-Content $env:GITHUB_PATH $dir }
          }
        }

    - name: Install missing Linux CLIs
      if: runner.os == 'Linux'
      shell: bash
      env:
        YQ_VERSION: v4.54.1
      run: |
        set -euo pipefail
        packages=()
        # GitHub's Ubuntu image ships GNU awk as `awk` (needed for `awk -i inplace`); CodeBuild's ships mawk.
        # Installing gawk makes it the `awk` alternative.
        awk --version 2>/dev/null | grep -q "GNU Awk" || packages+=(gawk)
        # raven-actions/actionlint installs its helpers with pipx.
        command -v pipx >/dev/null || packages+=(pipx)
        if (( ${#packages[@]} )); then
          if command -v apt-get >/dev/null; then
            sudo apt-get install -y -qq "${packages[@]}" >/dev/null \
              || { sudo apt-get update -qq && sudo apt-get install -y -qq "${packages[@]}" >/dev/null; }
          else
            sudo dnf install -y -q "${packages[@]}"
          fi
        fi
        if ! yq --version 2>/dev/null | grep -q mikefarah; then
          arch=$(dpkg --print-architecture 2>/dev/null || uname -m | sed 's/x86_64/amd64/; s/aarch64/arm64/')
          sudo curl -fsSL -o /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_${arch}"
          sudo chmod +x /usr/local/bin/yq
        fi

    # CodeBuild runs the job in a container (/.dockerenv exists) next to the Docker daemon, not on it.
    # Testcontainers 3.x then resolves container addresses through Docker's default "bridge" network,
    # which fails (KeyError: 'bridge') for containers on a custom network, as our contract tests use.
    # Mapped ports are not reachable on localhost from the job container, only via its default gateway
    # (the Docker host), so point Testcontainers there and drop the in-container detection.
    - name: Point Testcontainers at the Docker host
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if [ -f /.dockerenv ]; then
          gateway=$(ip route 2>/dev/null | awk '/^default/ {print $3; exit}')
          if [ -n "$gateway" ]; then
            echo "TC_HOST=$gateway" >> "$GITHUB_ENV"
            sudo rm -f /.dockerenv
          fi
        fi
