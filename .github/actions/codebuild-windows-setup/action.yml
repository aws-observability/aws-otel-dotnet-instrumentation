name: CodeBuild Windows runner setup
description: >
  Gives CodeBuild-hosted Windows runners the tools our workflows expect from GitHub's windows-2022 image.
  Safe to run anywhere; it only adds what is missing. Git long paths must already be enabled for checkout
  (see the GIT_CONFIG_* env in the calling workflow), since this action only exists after checkout.
runs:
  using: composite
  steps:
    - name: Put Git Bash on PATH
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if (-not (Get-Command bash -ErrorAction SilentlyContinue)) {
          Add-Content $env:GITHUB_PATH "$env:ProgramFiles\Git\bin"
        }

    - name: Install missing CLIs
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $missing = @('gh', 'jq') | Where-Object { -not (Get-Command $_ -ErrorAction SilentlyContinue) }
        if ($missing) {
          choco install @missing -y --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Chocolatey updates the machine PATH, which this runner process does not reload.
          foreach ($dir in "$env:ProgramFiles\GitHub CLI", "$env:ProgramData\chocolatey\bin") {
            if (Test-Path $dir) { Add-Content $env:GITHUB_PATH $dir }
          }
        }
