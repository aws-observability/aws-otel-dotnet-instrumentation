name: 'Build and Scan Image'
description: 'Downloads, unzips artifacts and builds container images'
inputs:
  image-name:
    description: 'Docker image name'
    required: true
  trivyignore-file:
    description: 'Path to the .trivyignore.yaml file to use for this scan'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Download Linux x64 Artifact
      if: runner.os == 'Linux'
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 #v5.0.0
      with:
        name: aws-distro-opentelemetry-dotnet-instrumentation-linux-glibc-x64.zip
        path: ./artifacts/linux/x64

    - name: Download Linux x64 MUSL Artifact
      if: runner.os == 'Linux'
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 #v5.0.0
      with:
        name: aws-distro-opentelemetry-dotnet-instrumentation-linux-musl-x64.zip
        path: ./artifacts/linux/x64-musl

    - name: Download Linux arm64 Artifact
      if: runner.os == 'Linux'
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 #v5.0.0
      with:
        name: aws-distro-opentelemetry-dotnet-instrumentation-linux-glibc-arm64.zip
        path: ./artifacts/linux/arm64

    - name: Download Linux arm64 MUSL Artifact
      if: runner.os == 'Linux'
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 #v5.0.0
      with:
        name: aws-distro-opentelemetry-dotnet-instrumentation-linux-musl-arm64.zip
        path: ./artifacts/linux/arm64-musl

    - name: Download Windows Artifact
      if: runner.os == 'Windows'
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 #v5.0.0
      with:
        name: aws-distro-opentelemetry-dotnet-instrumentation-windows.zip
        path: ./artifacts/windows
    
    - name: Unzip Linux Artifacts
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # Stage each architecture's payload under OpenTelemetryDistribution/<arch>.
        # Dockerfile.linux copies OpenTelemetryDistribution/${TARGETARCH}, so a single
        # build context can produce correct amd64 and arm64 images.
        # unzip does not create nested parent directories, so create them first.
        mkdir -p ./OpenTelemetryDistribution/amd64 ./OpenTelemetryDistribution/arm64
        unzip ./artifacts/linux/x64/*.zip -d ./OpenTelemetryDistribution/amd64
        unzip ./artifacts/linux/x64-musl/*.zip "linux-musl-x64/*" -d ./OpenTelemetryDistribution/amd64
        unzip ./artifacts/linux/arm64/*.zip -d ./OpenTelemetryDistribution/arm64
        unzip ./artifacts/linux/arm64-musl/*.zip "linux-musl-arm64/*" -d ./OpenTelemetryDistribution/arm64

    - name: Unzip Windows Artifact
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        Expand-Archive -LiteralPath .\artifacts\windows\aws-distro-opentelemetry-dotnet-instrumentation-windows.zip -DestinationPath .\OpenTelemetryDistribution -Force

    - name: Set up Docker Buildx
      if: runner.os == 'Linux'
      uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 #3.11.1

    - name: Build Linux containers
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -e
        docker buildx build --platform linux/amd64 -t ${{ inputs.image-name }}-amd64 -f ./Dockerfile.linux --load .
        docker buildx build --platform linux/arm64 -t ${{ inputs.image-name }}-arm64 -f ./Dockerfile.linux --load .

    # The arm64 image is built with BuildKit's own emulation; running it on the host needs QEMU registered too.
    - name: Set up QEMU
      if: runner.os == 'Linux'
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 #v4.4.0
      with:
        platforms: arm64

    # Replays what the operator init container does (the image's own `cp -r /autoinstrumentation/. <volume>`)
    # and checks that every profiler path an operator may inject resolves to a native library of the right
    # architecture.
    - name: Verify Linux images
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        verify() {
          local arch="$1" elf_arch="$2"
          local image="${{ inputs.image-name }}-${arch}"
          local dest
          dest="$(mktemp -d)"
          docker run --rm --platform "linux/${arch}" -v "${dest}:/otel-auto-instrumentation-dotnet" \
            --entrypoint /bin/cp "${image}" -r /autoinstrumentation/. /otel-auto-instrumentation-dotnet
          for dir in linux linux-musl linux-x64 linux-musl-x64; do
            local lib="${dest}/${dir}/OpenTelemetry.AutoInstrumentation.Native.so"
            if [ ! -f "${lib}" ]; then
              echo "::error::${arch}: ${dir}/OpenTelemetry.AutoInstrumentation.Native.so is missing after copy"
              exit 1
            fi
            if ! file -bL "${lib}" | grep -q "${elf_arch}"; then
              echo "::error::${arch}: ${dir}/OpenTelemetry.AutoInstrumentation.Native.so is not ${elf_arch}: $(file -bL "${lib}")"
              exit 1
            fi
          done
          echo "${arch}: all profiler paths resolve to ${elf_arch}"
        }
        verify amd64 x86-64
        verify arm64 aarch64

    - name: Build Windows container
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        docker build -t ${{ inputs.image-name }} -f ./Dockerfile.windows2022 .

    - name: Scan x64 image
      if: runner.os == 'Linux'
      uses: ./.github/actions/image_scan
      with:
        image-ref: ${{ inputs.image-name }}-amd64
        severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
        logout: 'false'
        skip-dirs: '/usr/share/dotnet,/usr/share/powershell'
        trivyignore-file: ${{ inputs.trivyignore-file }}

    - name: Scan arm64 image
      if: runner.os == 'Linux'
      uses: ./.github/actions/image_scan
      with:
        image-ref: ${{ inputs.image-name }}-arm64
        severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
        logout: 'false'
        skip-dirs: '/usr/share/dotnet,/usr/share/powershell'
        trivyignore-file: ${{ inputs.trivyignore-file }}

    - name: Scan Windows image
      if: runner.os == 'Windows'
      uses: ./.github/actions/image_scan
      with:
        image-ref: ${{ inputs.image-name }}
        severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
        logout: 'false'
        skip-dirs: '/usr/share/dotnet,/usr/share/powershell'
        trivyignore-file: ${{ inputs.trivyignore-file }}