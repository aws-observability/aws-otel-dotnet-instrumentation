# Temporary diagnostics (cluster reads and existing test-route GET requests) for the preflight validation. DO NOT MERGE.
name: Diagnose .NET preflight Service Events snapshot validation
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  diagnostics:
    runs-on:
      - codebuild-adot-dotnet-runner-${{ github.run_id }}-${{ github.run_attempt }}
      - image:ubuntu-8.0
      - instance-size:small
    timeout-minutes: 10
    steps:
      - name: Configure test credentials
        uses: aws-actions/configure-aws-credentials@a03048d87541d1d9fcf2ecf528a4a65ba9bd7838
        with:
          role-to-assume: arn:aws:iam::${{ secrets.APPLICATION_SIGNALS_E2E_TEST_ACCOUNT_ID }}:role/${{ secrets.APPLICATION_SIGNALS_E2E_TEST_ROLE_NAME }}
          aws-region: us-east-1
      - name: Read current validation pod and agent diagnostics
        env:
          TEST_NAMESPACE: ns-43111172003-207
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name e2e-dotnet-adot-test --region us-east-1
          kubectl get pods -n "$TEST_NAMESPACE" -o json > test-pods.json
          jq '.items[] | {name:.metadata.name,phase:.status.phase,initImages:[.spec.initContainers[]?.image],containers:[.spec.containers[]|{name,image,env:[.env[]?|select(.name=="OTEL_SERVICE_NAME" or .name=="OTEL_AWS_SERVICE_EVENTS_ENABLED" or .name=="OTEL_AWS_APPLICATION_SIGNALS_ENABLED" or .name=="OTEL_AWS_OTLP_LOGS_ENDPOINT" or .name=="OTEL_AWS_OTLP_METRICS_ENDPOINT" or .name=="OTEL_AWS_APPLICATION_SIGNALS_EXPORTER_ENDPOINT" or .name=="OTEL_DOTNET_AUTO_PLUGINS" or .name=="OTEL_DOTNET_AUTO_LOGGER")]}]}' test-pods.json
          app_pod=$(jq -r '.items[]|select(any(.spec.containers[];.name=="back-end"))|.metadata.name' test-pods.json | head -n1)
          test -n "$app_pod"
          kubectl logs -n "$TEST_NAMESPACE" "$app_pod" -c back-end --tail=200
          traffic_pod=$(jq -r '.items[]|select(any(.spec.containers[];.name=="traffic-generator"))|.metadata.name' test-pods.json | head -n1)
          app_ip=$(jq -r '.items[]|select(any(.spec.containers[];.name=="back-end"))|.status.podIP' test-pods.json | head -n1)
          service_name=$(jq -r '.items[]|.spec.containers[]|select(.name=="back-end")|.env[]|select(.name=="OTEL_SERVICE_NAME")|.value' test-pods.json | head -n1)
          test -n "$traffic_pod"
          for route in health success failed-call exception; do
            echo "Checking existing test route /$route"
            kubectl exec -n "$TEST_NAMESPACE" "$traffic_pod" -- wget -S -O /dev/null "http://$app_ip:8080/$route" 2>&1 || true
          done
          kubectl logs -n "$TEST_NAMESPACE" "$traffic_pod" --tail=20 || true
          aws logs filter-log-events --region us-east-1 --log-group-name "/aws/service-events/$service_name" --limit 20 --no-paginate --query 'events[].message' --output json |
            jq '.[]|fromjson|{eventName,scope,resource,attributes,body,traceId,spanId}'
          agent_pods=$(kubectl get pods -n amazon-cloudwatch -l app.kubernetes.io/name=cloudwatch-agent -o jsonpath='{.items[*].metadata.name}')
          for agent_pod in $agent_pods; do
            kubectl logs -n amazon-cloudwatch "$agent_pod" --all-containers --tail=80 || true
          done
