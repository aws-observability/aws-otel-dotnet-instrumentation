name: Dynamic Instrumentation Contract Tests

# Focused contract-test signal for Dynamic Instrumentation. The full contract suite also runs in
# pr-build.yml's `contract-test` job (pytest over the whole contract-tests dir); this workflow runs only the
# di suite and is scoped to DI-related paths for a faster, targeted signal.
#
# Follows the serviceevents-contract-tests.yml pattern and EXTENDS its path list: this one also fires on the
# shared pieces a DI run depends on — set-up-contract-tests.sh, build-and-install-distro.sh and the
# amazon/base test harness. Without those, a change to the harness or the image build can break the DI suite
# while this workflow stays silent and only the full job catches it.

# The path list is duplicated across the two triggers because GitHub does not expand YAML anchors in
# workflow files. Keep the two copies in step.
#
# WHAT BELONGS IN IT: everything this suite's result actually depends on. The DI project is the obvious one,
# but the AutoInstrumentation plugin HOSTS DI (Plugin.cs calls InitializeDynamicInstrumentation and
# OnTracerProviderInitialized, and its csproj is what copies the DI DLL into the distribution), and the two
# shell scripts below are what this job runs to build and install that distribution -- a change to any of
# them can break DI while leaving this workflow unfired. Anything more distant is covered by pr-build.yml's
# `contract-test` job, which has no path filter at all.
on:
  pull_request:
    paths:
      - "src/AWS.Distro.OpenTelemetry.DynamicInstrumentation/**"
      - "src/AWS.Distro.OpenTelemetry.AutoInstrumentation/**"
      - "test/build-and-install-distro.sh"
      - "test/set-up-contract-tests.sh"
      - "test/contract-tests/tests/test/amazon/di/**"
      - "test/contract-tests/tests/test/amazon/base/**"
      - "test/contract-tests/templates/di/**"
      - "test/contract-tests/images/applications/DynamicInstrumentation.NetCore/**"
      - "test/contract-tests/images/mock-di-api/**"
      - "test/contract-tests/images/mock-collector/**"
      - ".github/workflows/di-contract-tests.yml"
  push:
    branches:
      - main
      - "release/v*"
    paths:
      - "src/AWS.Distro.OpenTelemetry.DynamicInstrumentation/**"
      - "src/AWS.Distro.OpenTelemetry.AutoInstrumentation/**"
      - "test/build-and-install-distro.sh"
      - "test/set-up-contract-tests.sh"
      - "test/contract-tests/tests/test/amazon/di/**"
      - "test/contract-tests/tests/test/amazon/base/**"
      - "test/contract-tests/templates/di/**"
      - "test/contract-tests/images/applications/DynamicInstrumentation.NetCore/**"
      - "test/contract-tests/images/mock-di-api/**"
      - "test/contract-tests/images/mock-collector/**"
      - ".github/workflows/di-contract-tests.yml"
  workflow_dispatch: # allow running on demand

permissions:
  contents: read

jobs:
  di-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0

      - name: Setup .NET
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d #v5.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c #v6.0.0
        with:
          python-version: '3.10'

      # Name the application explicitly. With no arguments set-up-contract-tests.sh builds ALL SEVEN
      # applications -- including cloudwatch-plugin-otel, which needs build args and has its own job -- for a
      # run that only ever starts one of them. Naming it also keeps this workflow honest: it must not pass
      # because some other application's image happened to be lying around.
      - name: Set up and run the DI contract tests with pytest
        run: |
          cd test
          bash ./build-and-install-distro.sh
          bash ./set-up-contract-tests.sh DynamicInstrumentation.NetCore
          pytest contract-tests/tests/test/amazon/di -v
