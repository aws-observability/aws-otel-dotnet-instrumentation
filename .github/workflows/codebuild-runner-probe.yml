# TEMPORARY: re-runs the steps that failed on CodeBuild runners in PR #474, with the setup-action fixes.
# Delete this branch once the runner migration is done.
name: CodeBuild Runner Probe
on:
  push:
    branches:
      - codebuild-probe

permissions:
  contents: read

jobs:
  linux-actionlint:
    runs-on:
      - codebuild-adot-dotnet-runner-${{ github.run_id }}-${{ github.run_attempt }}
      - image:ubuntu-8.0
      - instance-size:large
      - probe-actionlint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0
      - uses: ./.github/actions/codebuild-runner-setup
      - name: Validate GitHub Actions workflows (same as pr-build static-code-checks)
        uses: raven-actions/actionlint@e01d1ea33dd6a5ed517d95b4c0c357560ac6f518 # v2.1.1
        with:
          files: .github/workflows/*.yml
          flags: |
            -ignore SC1001
            -ignore SC2027
            -ignore SC2086
            -ignore SC2162
            -ignore SC2206

  linux-contract:
    runs-on:
      - codebuild-adot-dotnet-runner-${{ github.run_id }}-${{ github.run_attempt }}
      - image:ubuntu-8.0
      - instance-size:large
      - probe-contract
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0
      - uses: ./.github/actions/codebuild-runner-setup
      - name: Network diagnostics
        run: |
          ls -la /.dockerenv 2>&1 || true
          ip route 2>/dev/null || cat /proc/net/route
          docker network ls
          docker run -d --name probe-web -p 80 public.ecr.aws/nginx/nginx:stable-alpine >/dev/null
          port=$(docker port probe-web 80/tcp | head -1 | sed 's/.*://')
          gw=$(ip route 2>/dev/null | awk '/default/ {print $3; exit}')
          for h in localhost 127.0.0.1 "$gw"; do printf '%-12s %s\n' "$h" "$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://$h:$port/" || echo FAIL)"; done
          docker rm -f probe-web >/dev/null
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d #v5.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c #v6.0.0
        with:
          python-version: '3.10'
      - name: Set up cloudwatch-plugin-otel contract tests
        env:
          OTEL_VERSION: 1.17.0
          OTEL_AUTO_INSTRUMENTATION_VERSION: 1.16.0
          OTEL_INSTRUMENTATION_VERSION: 1.16.0
        run: |
          cd test
          bash ./set-up-contract-tests.sh cloudwatch-plugin-otel
      - name: Run cloudwatch-plugin-otel/span_metrics contract tests with pytest
        run: |
          cd test
          pytest contract-tests/tests/test/amazon/cloudwatch_plugin_otel

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Registry LongPathsEnabled only (from the setup action), workspace path unchanged.
          - name: registry
            workdir: .
          # Fallback: also build from a short junction to the workspace.
          - name: junction
            workdir: C:\w
    runs-on:
      - codebuild-adot-dotnet-runner-${{ github.run_id }}-${{ github.run_attempt }}
      - image:windows-ec2-2022
      - instance-size:large
      - probe-windows-${{ matrix.name }}
    timeout-minutes: 40
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: true
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0
      - uses: ./.github/actions/codebuild-runner-setup
      - name: Create junction
        if: matrix.name == 'junction'
        run: |
          cmd /c mklink /J C:\w "$env:GITHUB_WORKSPACE"
          (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem').LongPathsEnabled
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d #v5.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Build on Windows (same as pr-build build)
        working-directory: ${{ matrix.workdir }}
        run: .\build.cmd
      - name: net472 unit tests (same as pr-build cloudwatch-plugin-tests)
        if: always()
        working-directory: ${{ matrix.workdir }}
        run: >
          dotnet test test/AWS.OpenTelemetry.CloudWatch.Plugin.Tests
          --configuration Release
          --framework net472
          -p:OpenTelemetryVersion=1.15.3
          -p:OpenTelemetryAutoInstrumentationVersion=1.15.0
