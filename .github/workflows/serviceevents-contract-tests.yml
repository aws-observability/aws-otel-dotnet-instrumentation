name: ServiceEvents Contract Tests

# Focused contract-test signal for the ServiceEvents SDK. The full contract
# suite also runs in pr-build.yml's `contract-test` job (pytest over the whole
# contract-tests dir); this workflow runs only the serviceevents suite and is
# scoped to serviceevents-related paths for a faster, targeted signal.

on:
  pull_request:
    paths:
      - "src/AWS.Distro.OpenTelemetry.ServiceEvents/**"
      - "test/contract-tests/tests/test/amazon/serviceevents/**"
      - "test/contract-tests/images/applications/ServiceEvents.NetCore/**"
      - "test/contract-tests/images/mock-collector/**"
      - ".github/workflows/serviceevents-contract-tests.yml"
  push:
    branches:
      - main
      - "release/v*"
    paths:
      - "src/AWS.Distro.OpenTelemetry.ServiceEvents/**"
      - "test/contract-tests/tests/test/amazon/serviceevents/**"
      - "test/contract-tests/images/applications/ServiceEvents.NetCore/**"
      - "test/contract-tests/images/mock-collector/**"
      - ".github/workflows/serviceevents-contract-tests.yml"
  workflow_dispatch: # allow running on demand

permissions:
  contents: read

jobs:
  serviceevents-contract-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout @ SHA - ${{ github.sha }}
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0

      - name: Setup .NET
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d #v5.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c #v6.0.0
        with:
          python-version: '3.10'

      - name: Set up and run the ServiceEvents contract tests with pytest
        run: |
          cd test
          bash ./build-and-install-distro.sh
          bash ./set-up-contract-tests.sh ServiceEvents.NetCore
          pytest contract-tests/tests/test/amazon/serviceevents
