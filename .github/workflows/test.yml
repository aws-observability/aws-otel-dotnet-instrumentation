# Runs the full PR Build suite on a direct push to a feature branch, so a branch can be validated
# BEFORE (or without) a pull request being open. pr-build.yml itself only triggers on pull_request,
# so it is invoked here as a reusable workflow via its workflow_call trigger.
#
# Its three PR-diff-dependent checks (CHANGELOG, versioned actions, github.event in run steps) all
# need github.base_ref and are skipped on a push; everything that compiles, tests, packages or scans
# runs exactly as it does on a PR.
name: Test
on:
  push:
    branches:
      - feature/Dynamic_Instrumentation
      - feature/DI_Line_Level

permissions:
  id-token: write
  contents: read

jobs:
  pr-build:
    uses: ./.github/workflows/pr-build.yml
    secrets: inherit
